<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volantis</title>
  <style>
    :root { --bg: #faf8f8; --fg: #2b2b2b; --muted: #4e4e4e; --card: #ffffff; --line: #e5e5e5; --accent: #284b63; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161618; --fg: #ebebec; --muted: #d4d4d4; --card: #1f1f22; --line: #393639; --accent: #7b97aa; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; width: 100%; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a { display: block; padding: 1rem 1.25rem; margin-bottom: .75rem; border: 1px solid var(--line); border-radius: 8px;
        background: var(--card); color: var(--accent); text-decoration: none; font-size: 1.15rem; font-weight: 600; }
    a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Volantis</h1>
    <p>Kies je campagne.</p>
    <a href="therapeut-cult/">Therapeut-cult</a>
    <a href="smokkerellen/">Smokkerellen</a>
  </main>
</body>
</html>
